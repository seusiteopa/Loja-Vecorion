<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loja</title>
<meta name="description" content="Loja online — escolha seus produtos e finalize o pedido pelo WhatsApp.">
<meta property="og:type" content="website">
<meta property="og:title" content="Loja">
<meta property="og:description" content="Loja online — escolha seus produtos e finalize o pedido pelo WhatsApp.">
<link id="favicon" rel="icon" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============ RESET / BASE ============ */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--color-bg);
  color:var(--color-text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:1rem;}
a{color:inherit;}
ul{margin:0;padding:0;list-style:none;}
svg{width:100%;height:100%;}

/* ============ TOKENS ============ */
:root{
  --color-primary:#0B7F7B;
  --color-primary-dark:#085e5b;
  --color-secondary:#1F2937;
  --color-accent:#F59E0B;
  --color-bg:#F8FAFC;
  --color-surface:#FFFFFF;
  --color-text:#0F172A;
  --color-text-muted:#64748B;
  --color-border:#E2E8F0;
  --color-success:#166534;
  --color-success-bg:#DCFCE7;
  --color-warning:#92400E;
  --color-warning-bg:#FEF3C7;
  --color-danger:#B91C1C;
  --color-danger-bg:#FEE2E2;
  --radius-sm:8px;
  --radius:14px;
  --radius-lg:20px;
  --shadow:0 4px 20px rgba(15,23,42,.08);
  --shadow-lg:0 12px 40px rgba(15,23,42,.16);
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--space-8:64px;
  --font-heading:'Sora',sans-serif;
  --font-body:'Inter',sans-serif;
  --header-h:64px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}

/* ============ TYPE ============ */
h1,h2,h3,h4{font-family:var(--font-heading);margin:0;line-height:1.15;color:var(--color-text);}
h1{font-size:1.9rem;font-weight:800;}
h2{font-size:1.4rem;font-weight:700;}
h3{font-size:1.1rem;font-weight:700;}
p{margin:0;line-height:1.55;}
.muted{color:var(--color-text-muted);}
.small{font-size:.85rem;}

/* ============ LAYOUT ============ */
.container{max-width:1200px;margin:0 auto;padding:0 var(--space-4);}
.app-shell{min-height:100vh;display:flex;flex-direction:column;}
.section{padding-top:var(--space-6);padding-bottom:var(--space-6);}
.grid{display:grid;gap:var(--space-4);}
.grid-products{grid-template-columns:repeat(2,1fr);}
@media (min-width:640px){.grid-products{grid-template-columns:repeat(3,1fr);}}
@media (min-width:960px){.grid-products{grid-template-columns:repeat(4,1fr);}}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 20px;border-radius:var(--radius-sm);
  font-weight:600;font-size:.95rem;border:1.5px solid transparent;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
  text-decoration:none;white-space:nowrap;
}
.btn:active{transform:scale(.98);}
.btn:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary,#fff);}
.btn-primary:hover{background:var(--color-primary-dark);}
.btn-secondary{background:transparent;border-color:var(--color-border);color:var(--color-text);}
.btn-secondary:hover{border-color:var(--color-primary);color:var(--color-primary);}
.btn-ghost{background:transparent;color:var(--color-text-muted);}
.btn-ghost:hover{color:var(--color-text);}
.btn-danger{background:var(--color-danger-bg);color:var(--color-danger);}
.btn-danger:hover{background:#fecaca;}
.btn-block{width:100%;}
.btn-sm{min-height:36px;padding:0 14px;font-size:.85rem;}
.btn-icon{width:44px;height:44px;padding:0;border-radius:50%;background:transparent;color:var(--color-text);flex:none;}
.btn-icon:hover{background:var(--color-border);}
.btn-icon svg{width:22px;height:22px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.ph-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;width:1.25em;height:1.25em;vertical-align:middle;}
.btn .ph-icon{width:18px;height:18px;}
.btn-icon .ph-icon{width:22px;height:22px;}

/* ============ HEADER ============ */
.site-header{
  position:sticky;top:0;
  background:var(--color-surface);border-bottom:1px solid var(--color-border);
  z-index:40;padding-top:env(safe-area-inset-top,0px);
}
.site-header .container{height:var(--header-h);display:flex;align-items:center;gap:var(--space-3);}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-heading);font-weight:800;font-size:1.1rem;flex:none;cursor:pointer;}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--color-primary);color:var(--color-on-primary,#fff);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.95rem;flex:none;}
.brand-mark.has-logo{background:transparent;overflow:hidden;}
.brand-mark.has-logo img{width:100%;height:100%;object-fit:contain;}
.brand-name{display:none;}
@media (min-width:640px){.brand-name{display:block;}}
.search-box{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--color-bg);
  border:1.5px solid var(--color-border);border-radius:999px;padding:0 14px;height:42px;
}
.search-box svg{width:18px;height:18px;color:var(--color-text-muted);flex:none;}
.search-box input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:none;color:var(--color-text);}
.search-box:focus-within{border-color:var(--color-primary);}
.header-actions{display:flex;align-items:center;gap:4px;flex:none;}
.cart-btn{position:relative;}
.cart-badge{
  position:absolute;top:2px;right:2px;background:var(--color-accent);color:var(--color-on-accent,#fff);
  font-size:.68rem;font-weight:700;min-width:18px;height:18px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}

/* category chips (mobile row under header) */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:var(--space-3) var(--space-4);-webkit-overflow-scrolling:touch;width:100%;max-width:1200px;margin:0 auto;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex:none;min-height:44px;padding:8px 16px;border-radius:999px;border:1.5px solid var(--color-border);
  background:var(--color-surface);font-size:.85rem;font-weight:600;color:var(--color-text-muted);
  white-space:nowrap;transition:.15s;
}
.chip.active,.chip:hover{border-color:var(--color-primary);color:var(--color-primary);background:color-mix(in srgb, var(--color-primary) 8%, white);}

/* ============ BANNER ============ */
.banner{
  border-radius:var(--radius-lg);overflow:hidden;position:relative;min-height:220px;
  display:flex;align-items:center;padding:var(--space-6);color:#fff;
  background:linear-gradient(135deg, var(--color-secondary), var(--color-primary));
  margin-top:var(--space-4);
}
.banner-wrap{position:relative;margin-top:var(--space-4);}
.banner-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:var(--radius-lg);scrollbar-width:none;}
.banner-track::-webkit-scrollbar{display:none;}
.banner-track:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;}
.banner-track .banner{flex:0 0 100%;scroll-snap-align:start;margin-top:0;border-radius:0;background-size:cover;background-position:center;}
.banner-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#111827;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:2;}
.banner-nav .ph-icon{width:22px;height:22px;}
.banner-prev{left:8px;}.banner-next{right:8px;}
.cat-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;}
.cat-tile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:0;background:none;border:0;color:var(--color-text);}
.cat-tile-img{width:100%;aspect-ratio:1/1;border-radius:var(--radius);overflow:hidden;background:color-mix(in srgb, var(--color-primary) 8%, white);border:1px solid var(--color-border);}
.cat-tile-img img{width:100%;height:100%;object-fit:cover;}
.cat-tile:hover .cat-tile-img{border-color:var(--color-primary);}
.cat-tile-name{font-weight:700;font-size:.9rem;}
.banner-content{max-width:420px;}
.banner h2{color:#fff;font-size:1.6rem;margin-bottom:8px;}
.banner p{color:rgba(255,255,255,.85);margin-bottom:var(--space-4);}
@media (min-width:768px){.banner{min-height:320px;padding:var(--space-8);}.banner h2{font-size:2.1rem;}}

/* ============ PRODUCT CARD ============ */
.card{
  background:var(--color-surface);border-radius:var(--radius);overflow:hidden;
  border:1px solid var(--color-border);transition:transform .15s ease, box-shadow .15s ease;
  display:flex;flex-direction:column;cursor:pointer;
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.card-img{aspect-ratio:1/1;background:color-mix(in srgb, var(--color-primary) 8%, white);display:flex;align-items:center;justify-content:center;position:relative;}
.card-img img{width:100%;height:100%;object-fit:cover;}
.card-img > .ph-icon{width:38%;height:38%;color:var(--color-primary);opacity:.55;}
.badge{position:absolute;top:8px;left:8px;background:var(--color-accent);color:var(--color-on-accent,#fff);font-size:.68rem;font-weight:700;padding:3px 8px;border-radius:6px;}
.badge-promo{background:var(--color-danger);color:#fff;}
.badge-out{background:#374151;color:#fff;}
.badge-new{background:var(--color-primary);color:var(--color-on-primary,#fff);}
.card.is-out .card-img img,.card.is-out .card-img > .ph-icon{opacity:.45;}
.card.is-out .price{color:var(--color-text-muted);}
.card-body{padding:var(--space-3);display:flex;flex-direction:column;gap:4px;flex:1;}
.card-body h3{font-size:.92rem;line-height:1.3;}
.price-row{display:flex;align-items:baseline;gap:6px;margin-top:auto;}
.price{font-weight:800;color:var(--color-text);}
.price-old{font-size:.8rem;color:var(--color-text-muted);text-decoration:line-through;}
.price-promo{color:var(--color-danger);}
.card-add{position:absolute;bottom:8px;right:8px;width:44px;height:44px;padding:0;border-radius:50%;background:var(--color-primary);color:var(--color-on-primary,#fff);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow);}
.card-add svg{width:18px;height:18px;}

/* ============ EMPTY STATE ============ */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:var(--space-7) var(--space-4);gap:var(--space-3);color:var(--color-text-muted);}
.empty-state .ph-icon{width:64px;height:64px;color:var(--color-border);}
.empty-state h3{color:var(--color-text);}

/* ============ PRODUCT DETAIL ============ */
.product-detail{display:grid;gap:var(--space-5);padding:var(--space-4) 0 var(--space-8);}
@media (min-width:768px){.product-detail{grid-template-columns:1fr 1fr;align-items:start;}}
.pd-gallery{border-radius:var(--radius-lg);overflow:hidden;background:color-mix(in srgb, var(--color-primary) 8%, white);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;}
.pd-gallery img{width:100%;height:100%;object-fit:cover;}
.pd-gallery > .ph-icon{width:30%;height:30%;color:var(--color-primary);opacity:.5;}
.pd-info h1{font-size:1.5rem;margin-bottom:6px;}
.pd-price{display:flex;align-items:baseline;gap:10px;margin:var(--space-3) 0;}
.pd-price .price{font-size:1.6rem;}
.variation-group{margin-bottom:var(--space-4);}
.variation-group>label{display:block;font-weight:700;margin-bottom:8px;font-size:.9rem;}
.variation-opts{display:flex;flex-wrap:wrap;gap:8px;}
.variation-opt{
  padding:8px 16px;border-radius:var(--radius-sm);border:1.5px solid var(--color-border);
  background:var(--color-surface);font-weight:600;font-size:.9rem;min-height:44px;
}
.variation-opt.selected{border-color:var(--color-primary);background:color-mix(in srgb, var(--color-primary) 10%, white);color:var(--color-primary);}
.qty-stepper{display:inline-flex;align-items:center;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);}
.qty-stepper button{width:44px;height:44px;background:transparent;border:0;display:flex;align-items:center;justify-content:center;color:var(--color-text);}
.qty-stepper button svg{width:16px;height:16px;}
.qty-stepper span{min-width:36px;text-align:center;font-weight:700;}
.pd-desc{margin-top:var(--space-5);white-space:pre-wrap;}
.pd-out{font-weight:700;color:var(--color-danger);margin:var(--space-3) 0;}
.pd-thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;}
.pd-thumb{flex:none;width:64px;height:64px;padding:0;border:2px solid var(--color-border);border-radius:var(--radius-sm);overflow:hidden;background:var(--color-surface);}
.pd-thumb img{width:100%;height:100%;object-fit:cover;}
.pd-thumb.selected{border-color:var(--color-primary);}

/* ============ CART DRAWER ============ */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;}
.overlay.open{opacity:1;pointer-events:auto;}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:100%;max-width:420px;background:var(--color-surface);
  z-index:61;transform:translateX(100%);visibility:hidden;transition:transform .25s ease, visibility 0s linear .25s;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.drawer.open{transform:translateX(0);visibility:visible;transition:transform .25s ease, visibility 0s;}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:var(--space-4);border-bottom:1px solid var(--color-border);flex:none;}
.drawer-body{flex:1;overflow-y:auto;padding:var(--space-4);}
.drawer-footer{border-top:1px solid var(--color-border);padding:var(--space-4);flex:none;}
.cart-item{display:flex;gap:12px;padding:var(--space-3) 0;border-bottom:1px solid var(--color-border);}
.cart-item-img{width:64px;height:64px;border-radius:var(--radius-sm);background:color-mix(in srgb, var(--color-primary) 8%, white);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.cart-item-img img{width:100%;height:100%;object-fit:cover;}
.cart-item-img .ph-icon{width:50%;height:50%;color:var(--color-primary);opacity:.5;}
.cart-item-info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0;}
.cart-item-info h4{font-size:.9rem;}
.cart-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-3);}
.total-row .price{font-size:1.3rem;}

/* ============ FORMS ============ */
.field{margin-bottom:var(--space-4);}
.field label{display:block;font-weight:600;font-size:.85rem;margin-bottom:6px;}
.field input,.field select,.field textarea{
  width:100%;padding:11px 14px;border:1.5px solid var(--color-border);border-radius:var(--radius-sm);
  background:var(--color-surface);color:var(--color-text);min-height:44px;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--color-primary);}
.field textarea{min-height:88px;resize:vertical;}
.field-error{color:var(--color-danger);font-size:.8rem;margin-top:4px;}
.field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--color-danger);}
.field-row{display:grid;gap:0 var(--space-3);grid-template-columns:1fr;}
@media (min-width:560px){.field-row-2{grid-template-columns:1fr 1fr;}.field-row-3{grid-template-columns:2fr 1fr 1fr;}}
fieldset{border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--space-4);margin:0 0 var(--space-4);}
legend{font-family:var(--font-heading);font-weight:700;padding:0 6px;}

/* ============ CHECKOUT STEPS ============ */
.step-title{display:flex;align-items:center;gap:10px;margin-bottom:var(--space-3);}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--color-primary);color:var(--color-on-primary,#fff);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex:none;}
.review-box{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--space-4);margin-bottom:var(--space-4);}
.review-box h4{margin-bottom:8px;}

/* ============ CONFIRMATION ============ */
.confirm-wrap{max-width:480px;margin:var(--space-8) auto;text-align:center;padding:0 var(--space-4);}
.confirm-icon{width:72px;height:72px;border-radius:50%;background:var(--color-success-bg);color:var(--color-success);display:flex;align-items:center;justify-content:center;margin:0 auto var(--space-4);}
.confirm-icon svg{width:36px;height:36px;}
.order-id-pill{display:inline-block;background:var(--color-bg);border:1px solid var(--color-border);padding:6px 16px;border-radius:999px;font-weight:700;font-family:var(--font-heading);margin:var(--space-3) 0 var(--space-5);}

/* ============ FOOTER ============ */
.site-footer{background:var(--color-secondary);color:var(--color-on-secondary,#fff);margin-top:auto;padding:var(--space-6) 0;}
.site-footer .container{display:flex;flex-direction:column;gap:var(--space-3);}
.site-footer a{color:var(--color-on-secondary,#fff);text-decoration:underline;}
.footer-links{display:flex;flex-wrap:wrap;gap:16px;}
.footer-copy{font-size:.8rem;}

/* ============ TOASTS ============ */
.toast{
  position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-20px);
  background:var(--color-text);color:#fff;padding:12px 20px;border-radius:999px;
  font-size:.9rem;font-weight:600;z-index:100;opacity:0;transition:all .25s ease;
  box-shadow:var(--shadow-lg);max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast-error{background:var(--color-danger);}
.toast-success{background:var(--color-success);}

/* ============ MODAL (confirm dialogs) ============ */
.modal-box{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:71;
  background:var(--color-surface);border-radius:var(--radius);padding:var(--space-5);
  width:min(360px,90vw);box-shadow:var(--shadow-lg);
}
.modal-box h3{margin-bottom:8px;}
.modal-actions{display:flex;gap:10px;margin-top:var(--space-4);}

/* ============ ADMIN ============ */
.admin-shell{display:flex;min-height:100vh;padding-top:0;}
.admin-login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--space-4);background:var(--color-bg);}
.admin-login-card{background:var(--color-surface);border-radius:var(--radius-lg);padding:var(--space-6);width:100%;max-width:380px;box-shadow:var(--shadow);}
.admin-login-icon{width:52px;height:52px;border-radius:50%;background:var(--color-secondary);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4);}
.admin-login-icon svg{width:24px;height:24px;}
.admin-notice{background:var(--color-warning-bg);color:var(--color-warning);font-size:.8rem;padding:10px 14px;border-radius:var(--radius-sm);margin-top:var(--space-4);}

.admin-sidebar{
  width:220px;background:var(--color-secondary);color:var(--color-on-secondary,#fff);flex:none;
  display:none;flex-direction:column;padding:var(--space-4) var(--space-3);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;
}
@media (min-width:900px){.admin-sidebar{display:flex;}.admin-main{margin-left:220px;}}
.admin-sidebar .brand{color:#fff;margin-bottom:var(--space-5);padding:0 8px;}
.admin-nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--color-on-secondary,#fff);font-weight:600;font-size:.9rem;margin-bottom:2px;}
.admin-nav a svg{width:18px;height:18px;flex:none;}
.admin-nav a.active,.admin-nav a:hover{background:rgba(128,128,128,.3);color:var(--color-on-secondary,#fff);}
.admin-nav a.active{box-shadow:inset 3px 0 0 var(--color-on-secondary,#fff);}
.admin-sidebar-foot{margin-top:auto;padding-top:var(--space-4);border-top:1px solid rgba(128,128,128,.4);}
.admin-sidebar-foot a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;text-decoration:none;}
.admin-sidebar-foot a:hover{background:rgba(128,128,128,.3);}
.admin-nav a,.admin-mobile-nav a{text-decoration:none;}
.admin-sidebar-foot .ph-icon,.admin-nav .ph-icon{width:18px;height:18px;}
.admin-topbar{
  position:fixed;top:0;left:0;right:0;height:var(--header-h);background:var(--color-surface);
  border-bottom:1px solid var(--color-border);display:flex;align-items:center;gap:12px;padding:0 var(--space-4);z-index:30;
}
@media (min-width:900px){.admin-topbar{left:220px;}}
.admin-main{padding-top:calc(var(--header-h) + var(--space-5));padding-bottom:var(--space-8);min-width:0;}
.admin-main .container{max-width:1100px;}
.admin-mobile-nav{display:flex;overflow-x:auto;gap:4px;position:fixed;bottom:0;left:0;right:0;background:var(--color-surface);border-top:1px solid var(--color-border);padding:6px var(--space-3);z-index:30;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));}
@media (min-width:900px){.admin-mobile-nav{display:none;}}
.admin-mobile-nav a{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--color-text-muted);font-size:.65rem;font-weight:600;border-radius:var(--radius-sm);}
.admin-mobile-nav a svg{width:20px;height:20px;}
.admin-mobile-nav a.active{color:var(--color-primary);}
.page-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-3);margin-bottom:var(--space-5);}

.kpi-grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(2,1fr);margin-bottom:var(--space-6);}
@media (min-width:640px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:var(--space-4);}
.kpi-card .kpi-value{font-family:var(--font-heading);font-size:1.5rem;font-weight:800;}
.status-grid{display:grid;gap:var(--space-3);grid-template-columns:repeat(2,1fr);}
@media (min-width:640px){.status-grid{grid-template-columns:repeat(3,1fr);}}
@media (min-width:960px){.status-grid{grid-template-columns:repeat(6,1fr);}}

.admin-table-wrap{overflow-x:auto;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;min-width:600px;}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--color-border);font-size:.88rem;}
th{color:var(--color-text-muted);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
tr:last-child td{border-bottom:0;}
.row-thumb{width:40px;height:40px;border-radius:8px;background:color-mix(in srgb, var(--color-primary) 8%, white);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.row-thumb img{width:100%;height:100%;object-fit:cover;}
.row-thumb .ph-icon{width:55%;height:55%;color:var(--color-primary);opacity:.5;}
.row-actions{white-space:nowrap;}
.row-actions .btn{display:inline-flex;margin-right:4px;vertical-align:middle;}
td.row-actions{position:sticky;right:0;background:var(--color-surface);}
.status-pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:700;}
.status-novo{background:#DBEAFE;color:#1D4ED8;}
.status-aguardando_pagamento{background:var(--color-warning-bg);color:var(--color-warning);}

.status-em_preparacao{background:#FEF3C7;color:#92400E;}
.status-enviado{background:#CFFAFE;color:#0E7490;}
.status-concluido{background:var(--color-success-bg);color:var(--color-success);}

<script>
(function(){
'use strict';

/* ================= STORAGE ================= */
var DB_KEY='vecorion_catalog';
var CART_KEY='vecorion_cart';
var ORDERS_KEY='vecorion_orders';
var ADMIN_KEY='vecorion_admin';

function loadJSON(key,fallback){
  try{ var raw=localStorage.getItem(key); return raw?JSON.parse(raw):fallback; }
  catch(e){ console.error('Erro ao ler '+key,e); return fallback; }
}
function saveJSON(key,val){
  try{ localStorage.setItem(key,JSON.stringify(val)); return true; }
  catch(e){ console.error('Erro ao salvar '+key,e); toast('Não foi possível salvar (armazenamento cheio ou indisponível).','error'); return false; }
}

function defaultCatalog(){
  return {
    store:{
      nome:'Minha Loja',
      favicon:'🛍️',
      whatsapp:'',
      instagram:'',
      descricao:'Produtos selecionados para você.',
      cores:{primary:'#0B7F7B',secondary:'#1F2937',accent:'#F59E0B',bg:'#F8FAFC'}
    },
    categories:[],
    products:[],
    banners:[]
  };
}
function defaultAdmin(){ return {usuario:'admin',senha:'admin123'}; }

var catalog = loadJSON(DB_KEY,null);
if(!catalog){ catalog=defaultCatalog(); saveJSON(DB_KEY,catalog); }
var cart = loadJSON(CART_KEY,[]);
var orders = loadJSON(ORDERS_KEY,[]);
var admin = loadJSON(ADMIN_KEY,null);
if(!admin){ admin=defaultAdmin(); saveJSON(ADMIN_KEY,admin); }

var session = { loggedIn:false };
var uiState = { cartOpen:false, selectedVariation:{}, adminSidebarOpen:false, confirmModal:null, lastOrder:null };

/* ---- Online persistence (Netlify Function + Netlify Blobs) ----
   O catálogo (store/categories/products/banners) agora vive num documento
   versionado no servidor. localStorage passa a ser só cache/fallback local. */
var API_URL='/api/store-data';
var TOKEN_KEY='vecorion_admin_token';
var VERSION_KEY='vecorion_catalog_version';
var serverVersion = Number(localStorage.getItem(VERSION_KEY))||0;
var syncStatus = { online:true, syncing:false, lastError:null };

function getAdminToken(){ return localStorage.getItem(TOKEN_KEY)||''; }
function setAdminToken(v){ if(v){ localStorage.setItem(TOKEN_KEY,v); } else { localStorage.removeItem(TOKEN_KEY); } }

async function fetchCatalogFromServer(){
  var res=await fetch(API_URL,{method:'GET'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.json();
}
async function pushCatalogToServer(catalogData, expectedVersion){
  var headers={'Content-Type':'application/json'};
  var token=getAdminToken();
  if(token) headers['X-Admin-Token']=token;
  var res=await fetch(API_URL,{method:'POST',headers:headers,body:JSON.stringify({expectedVersion:expectedVersion,data:catalogData})});
  if(res.status===409){
    var conflictBody=await res.json().catch(function(){return {};});
    var err=new Error('conflito de versão');
    err.conflict=true; err.current=conflictBody.current;
    throw err;
  }
  if(!res.ok){
    var errBody=await res.json().catch(function(){return {};});
    throw new Error(errBody.error||('HTTP '+res.status));
  }
  return res.json();
}

function persistCart(){ saveJSON(CART_KEY,cart); }
function persistOrders(){ saveJSON(ORDERS_KEY,orders); }
function persistAdmin(){ saveJSON(ADMIN_KEY,admin); }

/* persistCatalog agora é assíncrona: salva localmente (cache) e envia ao servidor.
   Retorna true se sincronizou online, false se ficou só local (mostra aviso). */
async function persistCatalog(){
  saveJSON(DB_KEY,catalog);
  applyTheme();
  syncStatus.syncing=true;
  refreshSyncPill();
  try{
    var result=await pushCatalogToServer(catalog, serverVersion);
    serverVersion=result.version;
    localStorage.setItem(VERSION_KEY,String(serverVersion));
    syncStatus.online=true; syncStatus.syncing=false; syncStatus.lastError=null;
    refreshSyncPill();
    return true;
  }catch(err){
    syncStatus.syncing=false;
    if(err.conflict){
      syncStatus.online=true; syncStatus.lastError=null;
      catalog=err.current.data;
      serverVersion=err.current.version;
      saveJSON(DB_KEY,catalog);
      localStorage.setItem(VERSION_KEY,String(serverVersion));
      applyTheme();
      adminEditing={type:null,id:null};
      render();
      toast('Os dados foram atualizados por outro dispositivo. Recarregando os dados mais recentes — refaça sua última alteração.','error');
    }else{
      syncStatus.online=false; syncStatus.lastError=err.message;
      refreshSyncPill();
      toast('Não foi possível sincronizar com o servidor. Alteração salva só neste navegador por enquanto.','error');
    }
    return false;
  }
}

/* ================= UTIL ================= */
function fmtMoney(v){ return (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function uid(p){ return p+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g,function(s){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s];
  });
}
function norm(str){ return String(str==null?'':str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function isHttpUrl(u){ return /^https?:\/\//i.test(String(u||'')); }
function cssUrl(u){ return "url('"+String(u).replace(/['"()\\\s<>]/g,function(c){ return '%'+c.charCodeAt(0).toString(16).toUpperCase().padStart(2,'0'); })+"')"; }

/* ---- Fotos (Netlify Function /api/photo/*, armazenadas fora do catálogo) ---- */
function photoBase(scope,ownerId,photoId){ return '/api/photo/'+scope+'/'+encodeURIComponent(ownerId)+'/'+encodeURIComponent(photoId); }
function photoUrl(scope,ownerId,photoId,size){ return photoBase(scope,ownerId,photoId)+'/'+size; }
function newPhotoId(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : uid('foto'); }
function shrink(file,maxDim){
  return createImageBitmap(file).then(function(bmp){
    var k=Math.min(1,maxDim/Math.max(bmp.width,bmp.height));
    var canvas=document.createElement('canvas');
    canvas.width=Math.max(1,Math.round(bmp.width*k));
    canvas.height=Math.max(1,Math.round(bmp.height*k));
    canvas.getContext('2d').drawImage(bmp,0,0,canvas.width,canvas.height);
    return new Promise(function(resolve){
      canvas.toBlob(function(b){
        if(b && b.type==='image/webp'){ resolve(b); return; }
        canvas.toBlob(function(j){ resolve(j); },'image/jpeg',0.82);
      },'image/webp',0.82);
    });
  });
}
async function uploadPhotoBlob(scope,ownerId,photoId,blob,size){
  var headers={'Content-Type':blob.type||'image/jpeg'};
  var t=getAdminToken(); if(t) headers['X-Admin-Token']=t;
  var res=await fetch(photoUrl(scope,ownerId,photoId,size),{method:'POST',headers:headers,body:blob});
  if(!res.ok){ var b=await res.json().catch(function(){return{};}); throw new Error(b.error||('HTTP '+res.status)); }
}
function deletePhotoRemote(scope,ownerId,photoId){
  if(!photoId) return Promise.resolve();
  var headers={}; var t=getAdminToken(); if(t) headers['X-Admin-Token']=t;
  return fetch(photoBase(scope,ownerId,photoId),{method:'DELETE',headers:headers}).catch(function(){});
}
/* redimensiona (foto cheia + miniatura) e envia; devolve {id} pronto para guardar no registro */
async function handleSingleUpload(file,scope,ownerId,oldFotoId){
  var maxFull = scope==='loja' ? 400 : 1600;
  var maxThumb = scope==='loja' ? 400 : 480;
  var id=newPhotoId();
  var full=await shrink(file,maxFull);
  await uploadPhotoBlob(scope,ownerId,id,full,'f');
  var thumb = maxThumb===maxFull ? full : await shrink(file,maxThumb);
  await uploadPhotoBlob(scope,ownerId,id,thumb,'t');
  if(oldFotoId) deletePhotoRemote(scope,ownerId,oldFotoId);
  return {id:id};
}
function sortedByOrder(arr){ return arr.slice().sort(function(a,b){ return (a.ordem||0)-(b.ordem||0); }); }
function sortedCategories(){ return sortedByOrder(catalog.categories); }
function moveItem(kind,id,dir){
  var arr=kind==='category'?catalog.categories:catalog.banners;
  var sorted=sortedByOrder(arr);
  var i=sorted.findIndex(function(x){return x.id===id;}), j=i+dir;
  if(i<0||j<0||j>=sorted.length) return false;
  var tmp=sorted[i]; sorted[i]=sorted[j]; sorted[j]=tmp;
  sorted.forEach(function(x,k){ x.ordem=k; });
  return true;
}
function qs(sel,ctx){ return (ctx||document).querySelector(sel); }
function qsa(sel,ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(sel)); }
function todayCompact(){
  var d=new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}
function nowLabel(){
  var d=new Date();
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}

function toast(msg,type){
  type=type||'success';
  var el=document.createElement('div');
  el.className='toast toast-'+type;
  el.setAttribute('role','status');
  el.setAttribute('aria-live','polite');
  el.textContent=msg;
  document.body.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); },300); },2600);
}

async function syncOnLogin(){
  syncStatus.syncing=true;
  try{
    var doc=await fetchCatalogFromServer();
    serverVersion=doc.version||0;
    localStorage.setItem(VERSION_KEY,String(serverVersion));
    if(doc.data){
      catalog=doc.data;
      saveJSON(DB_KEY,catalog);
      applyTheme();
      syncStatus.online=true; syncStatus.lastError=null;
    }else{
      var local=loadJSON(DB_KEY,null);
      var hasRealData = local && ((local.products&&local.products.length) || (local.categories&&local.categories.length) || (local.banners&&local.banners.length) || (local.store && local.store.nome && local.store.nome!=='Minha Loja'));
      if(hasRealData){
        var result=await pushCatalogToServer(local,0);
        serverVersion=result.version;
        localStorage.setItem(VERSION_KEY,String(serverVersion));
        catalog=local;
        syncStatus.online=true; syncStatus.lastError=null;
        toast('Dados locais sincronizados como versão inicial da loja online.');
      }
    }
  }catch(err){
    syncStatus.online=false; syncStatus.lastError=err.message;
    toast('Não foi possível conectar à loja online agora. Continuando com os dados salvos neste navegador.','error');
  }
  syncStatus.syncing=false;
}

function openConfirm(opts){
  uiState.confirmModal=opts;
  render();
}
function closeConfirm(){ uiState.confirmModal=null; render(); }

  root.setProperty('--color-on-accent', getContrastColor(c.accent||'#F59E0B'));

    fav.setAttribute('href','data:image/svg+xml,'+encodeURIComponent(svg));

}
function getContrastColor(hex){
  hex=(hex||'#000000').replace('#','');
  if(hex.length!==6) return '#ffffff';
  var r=parseInt(hex.substr(0,2),16)/255, g=parseInt(hex.substr(2,2),16)/255, b=parseInt(hex.substr(4,2),16)/255;
  function lin(c){ return c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055,2.4); }
  var L=0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
  // escolhe entre branco e preto o que tem MAIOR contraste com a cor (garante >= 4,5:1 em qualquer cor)
  var withWhite=1.05/(L+0.05), withBlack=(L+0.05)/0.05;
  return withWhite>=withBlack ? '#ffffff' : '#000000';
}
function shadeColor(hex,percent){
  hex=(hex||'#000000').replace('#','');
  if(hex.length!==6) return '#'+hex;
  var num=parseInt(hex,16);
  var r=(num>>16)+percent, g=(num>>8 & 0x00FF)+percent, b=(num & 0x0000FF)+percent;
  r=Math.max(Math.min(255,r),0); g=Math.max(Math.min(255,g),0); b=Math.max(Math.min(255,b),0);
  return '#'+(0x1000000+r*0x10000+g*0x100+b).toString(16).slice(1);
}

/* ================= ROUTER ================= */
function parseHash(){
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('?');
  var path=parts[0]?('/'+parts[0]):'/';
  var params={};
  if(parts[1]){
    parts[1].split('&').forEach(function(pair){
      var kv=pair.split('=');
      if(kv[0]) params[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||'');
    });
  }
  return {path:path,params:params,segments:path.split('/').filter(Boolean)};
}

/* ================= CART LOGIC ================= */
function cartLineKey(productId,variation){
  return productId+'::'+JSON.stringify(variation||{});
}
function addToCart(productId, variation, qty){
  qty=qty||1;
  var product=catalog.products.find(function(p){ return p.id===productId; });
  if(!product) return;
  if(product.disponivel===false){ toast('Este produto está esgotado.','error'); return; }
  var key=cartLineKey(productId,variation);
  var existing=cart.find(function(i){ return i.key===key; });
  if(existing){ existing.qty+=qty; }
  else{
    cart.push({
      key:key, productId:productId, nome:product.nome,
      preco: (product.precoPromocional && Number(product.precoPromocional)>0) ? Number(product.precoPromocional) : Number(product.preco)||0,
      imagem: productPhotoUrl(product,0,'t'), variacao: variation||{}, qty: qty
    });
  }
  persistCart();
  toast('Adicionado ao carrinho.');
  render();
}
function updateCartQty(key,delta){
  var item=cart.find(function(i){ return i.key===key; });
  if(!item) return;
  item.qty+=delta;
  if(item.qty<=0){ cart=cart.filter(function(i){ return i.key!==key; }); }
  persistCart(); render();
}
function removeCartItem(key){
  cart=cart.filter(function(i){ return i.key!==key; });
  persistCart(); render();
}
function clearCart(){ cart=[]; persistCart(); }
function cartCount(){ return cart.reduce(function(s,i){ return s+i.qty; },0); }
function cartTotal(){ return cart.reduce(function(s,i){ return s+i.qty*i.preco; },0); }

/* ---- Pedidos online (Netlify Function /api/orders) ----
   Cliente: cria o pedido (público). Admin: lê e muda status (exige a chave de sincronização). */
var ORDERS_URL='/api/orders';
var serverOrders=null;      // null = ainda não carregados / sem acesso -> admin usa só os pedidos locais
var ordersError=null;       // {code,message}
var ordersTimer=null;
function adminOrders(){ return serverOrders!==null ? serverOrders : orders; }

async function createOrderOnServer(payload){
  var ctrl=(typeof AbortController!=='undefined') ? new AbortController() : null;
  var timer=ctrl ? setTimeout(function(){ ctrl.abort(); },8000) : null;
  try{
    var res=await fetch(ORDERS_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctrl?ctrl.signal:undefined});
    var body=await res.json().catch(function(){ return {}; });
    if(res.status===201) return {order:body};
    if(res.status===400) return {error:body.error||'Pedido inválido.'};
    return {offline:true};
  }catch(e){
    return {offline:true};
  }finally{
    if(timer) clearTimeout(timer);
  }
}

async function refreshServerOrders(silent){
  var headers={}; var t=getAdminToken(); if(t) headers['X-Admin-Token']=t;
  try{
    var res=await fetch(ORDERS_URL,{method:'GET',headers:headers});
    var body=await res.json().catch(function(){ return {}; });
    if(!res.ok){
      serverOrders=null;
      ordersError={code:body.code||('http-'+res.status),message:body.error||('HTTP '+res.status)};
      return false;
    }
    var prev=serverOrders ? serverOrders.length : null;
    serverOrders=body.orders||[];
    ordersError=null;
    if(silent && prev!==null && serverOrders.length>prev) toast('Novo pedido recebido!');
    return true;
  }catch(e){
    // sem rede: mantém a última lista carregada (se houver) e avisa
    ordersError={code:'offline',message:e.message};
    return false;
  }
}

async function setOrderStatus(id,status){
  if(serverOrders!==null){
    try{
      var h={'Content-Type':'application/json'}; var t=getAdminToken(); if(t) h['X-Admin-Token']=t;
      var res=await fetch(ORDERS_URL+'/'+encodeURIComponent(id)+'/status',{method:'POST',headers:h,body:JSON.stringify({status:status})});
      var body=await res.json().catch(function(){ return {}; });
      if(!res.ok) throw new Error(body.error||('HTTP '+res.status));
      serverOrders=serverOrders.map(function(o){ return o.id===id ? body : o; });
      render(); toast('Status atualizado.');
    }catch(e){
      toast('Não foi possível atualizar o status online: '+e.message,'error');
    }
    return;
  }
  var ord=orders.find(function(o){ return o.id===id; });
  if(ord){ ord.status=status; persistOrders(); render(); toast('Status atualizado.'); }
}

function startOrdersPolling(){
  if(ordersTimer) return;
  ordersTimer=setInterval(async function(){
    if(!session.loggedIn) return;
    await refreshServerOrders(true);
    if(session.loggedIn && (adminRoute==='dashboard' || (adminRoute==='pedidos' && !adminEditing.type)) && !uiState.confirmModal) render();
  },45000);
}
function stopOrdersPolling(){ if(ordersTimer){ clearInterval(ordersTimer); ordersTimer=null; } serverOrders=null; ordersError=null; }

var searchTerm='';

function filtersActive(){ return filters.promo||filters.destaque||filters.disp||!!filters.preco; }
function effectivePrice(p){ return (p.precoPromocional && Number(p.precoPromocional)>0 && Number(p.precoPromocional)<Number(p.preco)) ? Number(p.precoPromocional) : Number(p.preco)||0; }
var activeCategory='';

function visibleProducts(applyFilters){
  return catalog.products.filter(function(p){
    if(p.visivel===false) return false;
    if(applyFilters){
      if(filters.promo && !(p.precoPromocional && Number(p.precoPromocional)>0 && Number(p.precoPromocional)<Number(p.preco))) return false;
      if(filters.destaque && !p.destaque) return false;
      if(filters.disp && p.disponivel===false) return false;
      if(filters.preco && effectivePrice(p)>Number(filters.preco)) return false;
    }
    if(activeCategory && p.categoriaId!==activeCategory) return false;
    if(searchTerm){
      var catObj=catalog.categories.find(function(c){ return c.id===p.categoriaId; });
      var hay=norm(p.nome+' '+(p.descricaoCurta||'')+' '+(p.descricaoCompleta||'')+' '+(p.tags||[]).join(' ')+' '+(catObj?catObj.nome:''));
      return hay.indexOf(norm(searchTerm))>-1;
    }
    return true;
  });
}

function viewProduct(id){
  var p=catalog.products.find(function(x){ return x.id===id; });
  if(!p){
    return '<div class="container section">'+emptyState('box','Produto não encontrado','Ele pode ter sido removido.')+'</div>';
  }
  var promo = p.precoPromocional && Number(p.precoPromocional)>0 && Number(p.precoPromocional)<Number(p.preco);
  var variacoes=p.variacoes||[];
  var qty=uiState.qty||1;
  var out=p.disponivel===false;
  var fotos=p.fotos||[];
  if(uiState.galleryFor!==p.id){ uiState.galleryFor=p.id; uiState.galleryIndex=0; }
  var gi=Math.min(uiState.galleryIndex||0, Math.max(fotos.length-1,0));
  var mainUrl = fotos.length ? photoUrl('produto',p.id,fotos[gi].id,'f') : '';
  var mainImg = mainUrl ? '<div class="pd-gallery"><img src="'+escapeHtml(mainUrl)+'" alt="'+escapeHtml(p.nome)+'"></div>' : productImgHtml(p,'pd-gallery');
  var thumbs = fotos.length>1 ? '<div class="pd-thumbs">'+fotos.map(function(f,i){
      return '<button type="button" class="pd-thumb'+(i===gi?' selected':'')+'" data-action="pd-image" data-idx="'+i+'" aria-pressed="'+(i===gi?'true':'false')+'" aria-label="Ver imagem '+(i+1)+' de '+fotos.length+'"><img src="'+escapeHtml(photoUrl('produto',p.id,f.id,'t'))+'" alt=""></button>';
    }).join('')+'</div>' : '';
  return '' +
  '<div class="container">' +
    '<div class="product-detail">' +
      '<div>'+mainImg+thumbs+'</div>' +
      '<div class="pd-info">' +
        '<h1>'+escapeHtml(p.nome)+'</h1>' +
        (p.descricaoCurta?'<p class="muted">'+escapeHtml(p.descricaoCurta)+'</p>':'') +
        '<div class="pd-price">' +
          (promo?'<span class="price price-promo">'+fmtMoney(p.precoPromocional)+'</span><span class="price-old">'+fmtMoney(p.preco)+'</span>':'<span class="price">'+fmtMoney(p.preco)+'</span>') +
        '</div>' +
        (out ? '<p class="pd-out" role="status">Produto esgotado no momento.</p>' : '') +
        (out ? '' : variacoes.map(function(v){
          return '<div class="variation-group">' +
            '<label>'+escapeHtml(v.tipo)+'</label>' +
            '<div class="variation-opts">' +
              (v.opcoes||[]).map(function(op){
                var selected=uiState.selectedVariation[v.tipo]===op;
                return '<button type="button" class="variation-opt'+(selected?' selected':'')+'" data-action="select-variation" data-tipo="'+escapeHtml(v.tipo)+'" data-valor="'+escapeHtml(op)+'">'+escapeHtml(op)+'</button>';
              }).join('') +
            '</div>' +
          '</div>';
        }).join('')) +
        (out ? '' : '<div class="field">' +
          '<label>Quantidade</label>' +
          '<div class="qty-stepper">' +
            '<button type="button" data-action="pd-qty" data-delta="-1" aria-label="Diminuir quantidade">'+icon('minus')+'</button>' +
            '<span>'+qty+'</span>' +
            '<button type="button" data-action="pd-qty" data-delta="1" aria-label="Aumentar quantidade">'+icon('plus')+'</button>' +
          '</div>' +
        '</div>') +
        (out ? '<button class="btn btn-secondary btn-block" disabled>Produto esgotado</button>' : '<button class="btn btn-primary btn-block" data-action="add-to-cart" data-id="'+escapeHtml(p.id)+'">Adicionar ao carrinho</button>') +
        (p.descricaoCompleta?'<div class="pd-desc">'+escapeHtml(p.descricaoCompleta)+'</div>':'') +
      '</div>' +
    '</div>' +
  '</div>';
}

  return errs;
}

  var counts={};
  STATUS_FLOW.concat(['cancelado']).forEach(function(s){ counts[s]=allOrders.filter(function(o){return o.status===s;}).length; });
  return '' +
  '<div class="page-head"><h1>Painel da loja</h1></div>' +
  ordersNotice() +
  (catalog.store.whatsapp ? '' : '<div class="admin-notice" style="margin:0 0 16px">O WhatsApp da loja ainda não está configurado. Sem ele, os clientes não conseguem finalizar pedidos — configure em Configurações.</div>') +

function orderDetail(id){
  var o=adminOrders().find(function(x){return x.id===id;});
  if(!o) return emptyState('clipboard','Pedido não encontrado','');
  var idx=STATUS_FLOW.indexOf(o.status);
  var nextStatus = (idx>-1 && idx<STATUS_FLOW.length-1) ? STATUS_FLOW[idx+1] : null;
  return '' +
  '<div class="page-head"><h1>Pedido #'+escapeHtml(o.id)+'</h1><button class="btn btn-ghost" data-action="admin-cancel-edit">Voltar</button></div>' +
  '<div class="review-box"><h4>Cliente</h4><p>'+escapeHtml(o.cliente.nome)+'</p><p class="muted">'+escapeHtml(o.cliente.whatsapp)+'</p></div>' +

    o.itens.map(function(it){
      var varStr=Object.keys(it.variacao||{}).map(function(k){return it.variacao[k];}).join(' · ');
      return '<div class="cart-item-row" style="padding:6px 0"><span>'+it.qty+'x '+escapeHtml(it.nome)+(varStr?' ('+escapeHtml(varStr)+')':'')+'</span><strong>'+fmtMoney(it.preco*it.qty)+'</strong></div>';
    }).join('') +
    '<div class="total-row" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--color-border)"><span class="muted">Total</span><span class="price">'+fmtMoney(o.total)+'</span></div>' +
  '</div>' +
  '<div class="review-box"><h4>Entrega</h4><p>'+escapeHtml(o.entrega.rua)+', '+escapeHtml(o.entrega.numero)+(o.entrega.complemento?(' - '+escapeHtml(o.entrega.complemento)):'')+'</p><p>'+escapeHtml(o.entrega.bairro)+' · '+escapeHtml(o.entrega.cidade)+'-'+escapeHtml(o.entrega.estado)+'</p><p class="muted">CEP: '+escapeHtml(o.entrega.cep)+'</p></div>' +
  '<div class="review-box">' +
    '<h4>Status atual: <span class="status-pill status-'+safeStatus(o.status)+'">'+statusLabel(o.status)+'</span></h4>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">' +

function render(){
  var route=parseHash();
  var app=document.getElementById('app');
  var html='';
  var focusWasSearch = document.activeElement && document.activeElement.id==='search-input';
  var focusSelStart = focusWasSearch ? document.activeElement.selectionStart : null;
  var focusSelEnd = focusWasSearch ? document.activeElement.selectionEnd : null;

  var trackEl=qs('.banner-track');
  var trackScroll=trackEl?trackEl.scrollLeft:0;
  var focusSig = null;
  var ae = document.activeElement;
  if(ae && !focusWasSearch && ae.dataset && ae.dataset.filter){
    focusSig='[data-filter="'+ae.dataset.filter+'"]';
  } else if(ae && !focusWasSearch && ae.dataset && ae.dataset.action){
    focusSig = '[data-action="'+ae.dataset.action+'"]';
    ['key','delta','id','cat','tipo','valor','status','idx','kind','dir','target'].forEach(function(k){
      if(ae.dataset[k]!==undefined) focusSig += '[data-'+k+'="'+String(ae.dataset[k]).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"]';
    });
  }

  if(route.segments[0]==='admin'){
    if(!session.loggedIn){
      html=viewAdminLogin();
    }else{
      adminRoute = route.segments[1] || 'dashboard';
      if(!ADMIN_NAV.some(function(i){return i.key===adminRoute;})) adminRoute='dashboard';
      html=renderAdminShell(renderAdminInner());
    }
  } else if(route.path.indexOf('/produto/')===0){
    html=renderPublicShell(viewProduct(route.segments[1]));
  } else if(route.path==='/produtos'){
    html=renderPublicShell(viewListing());
  } else if(route.path==='/checkout'){
    html=renderPublicShell(viewCheckout());
  } else if(route.path.indexOf('/pedido/')===0){
    html=renderPublicShell(viewOrderConfirmation(route.segments[1]));
  } else {
    html=renderPublicShell(viewHome());
  }

  html+=renderConfirmModal();
  app.innerHTML=html;

  var searchInput=qs('#search-input');
  if(searchInput){
    if(focusWasSearch){
      searchInput.focus();
      try{ searchInput.setSelectionRange(focusSelStart, focusSelEnd); }catch(e){}
    }
    searchInput.addEventListener('input', function(e){
      searchTerm=e.target.value;
      if(route.path!=='/produtos'){ navigate('#/produtos'); } else { render(); }
    });
  }
  var newTrack=qs('.banner-track');
  if(newTrack && trackScroll) newTrack.scrollLeft=trackScroll;
  bindForms(route);
  autoLabel();
  if(focusSig){
    var again=null;
    try{ again=qs(focusSig); }catch(err){}
    if(again) again.focus();
  }
  if(uiState.confirmModal){
    var mb=qs('.modal-box [data-action="close-confirm"]');
    if(mb) mb.focus();
  }
}

/* associa cada <label> sem "for" ao campo que o segue, para leitores de tela e clique no rótulo */
/* Chama render() preservando o que já foi digitado num formulário aberto (produto/
   categoria/banner/config) — usada só pelas ações de foto, que precisam redesenhar a
   tela no meio da edição (para mostrar a miniatura) sem apagar nome/descrição/preço/
   variações que a pessoa já tinha preenchido mas ainda não salvou. Ações que trazem
   dado novo do servidor (ex.: resolver um conflito de versão) usam render() direto,
   de propósito, para que o valor atualizado do servidor substitua o que estava na tela. */
function renderPreservingForm(){
  var openFormBefore = qs('#product-form, #category-form, #banner-form, #config-form');
  var fieldSnapshot = null, variationSnapshot = null;
  if(openFormBefore){
    fieldSnapshot = {};
    qsa('[data-field]', openFormBefore).forEach(function(el){
      fieldSnapshot[el.dataset.field] = (el.type==='checkbox') ? el.checked : el.value;
    });
    if(openFormBefore.id==='product-form'){
      variationSnapshot = qsa('.repeater-row', openFormBefore).map(function(row){
        return { tipo: qs('[data-var-tipo]',row).value, opcoes: qs('[data-var-opcoes]',row).value };
      });
    }
  }
  render();
  if(fieldSnapshot){
    var openFormAfter = qs('#product-form, #category-form, #banner-form, #config-form');
    if(openFormAfter){
      qsa('[data-field]', openFormAfter).forEach(function(el){
        if(Object.prototype.hasOwnProperty.call(fieldSnapshot, el.dataset.field)){
          if(el.type==='checkbox') el.checked = fieldSnapshot[el.dataset.field];
          else el.value = fieldSnapshot[el.dataset.field];
        }
      });
      if(variationSnapshot && openFormAfter.id==='product-form'){
        var vList = qs('#variacoes-list', openFormAfter);
        if(vList){
          while(vList.children.length < variationSnapshot.length){
            vList.appendChild(createVariationRowEl(vList.children.length));
          }
          qsa('.repeater-row', vList).forEach(function(row, i){
            if(variationSnapshot[i]){
              qs('[data-var-tipo]',row).value = variationSnapshot[i].tipo;
              qs('[data-var-opcoes]',row).value = variationSnapshot[i].opcoes;
            }
          });
          autoLabel();
        }
      }
    }
  }
}
function createVariationRowEl(idx){
  var row=document.createElement('div');
  row.className='repeater-row'; row.dataset.varIdx=idx;
  row.innerHTML='<div class="field"><label>Tipo</label><input type="text" data-var-tipo placeholder="Ex: Tamanho"></div>'+
    '<div class="field"><label>Opções (separadas por vírgula)</label><input type="text" data-var-opcoes placeholder="P, M, G"></div>'+
    '<button type="button" class="btn btn-icon btn-danger" data-action="remove-variation-row" data-idx="'+idx+'" aria-label="Remover variação" style="margin-top:22px">'+icon('trash')+'</button>';
  return row;
}
var autoLabelCounter=0;
function autoLabel(){
  qsa('.field').forEach(function(f){
    var lab=f.querySelector('label');
    var ctrl=f.querySelector('input,select,textarea');
    if(!lab || !ctrl || lab.htmlFor) return;
    if(!ctrl.id){ autoLabelCounter++; ctrl.id='auto-f-'+autoLabelCounter; }
    lab.htmlFor=ctrl.id;
  });
}

document.addEventListener('click', async function(e){
  var target=e.target.closest('[data-action]');
  if(!target) return;
  var action=target.dataset.action;

  if(action==='skip-main'){ e.preventDefault(); var mainEl=qs('#main'); if(mainEl){ mainEl.focus(); } }
  else if(action==='go'){
    e.preventDefault();
    var dest=target.dataset.hash||'';
    if(isHttpUrl(dest)) window.open(dest,'_blank','noopener'); else navigate(dest);
  }
  else if(action==='toggle-cart'){
    uiState.cartOpen=!uiState.cartOpen; render();
    var focusTarget = uiState.cartOpen ? qs('.drawer .drawer-header .btn-icon') : qs('.cart-btn');
    if(focusTarget) focusTarget.focus();
  }
  else if(action==='filter-cat'){ activeCategory=target.dataset.cat; navigate('#/produtos'); }
  else if(action==='quick-add'){
    e.stopPropagation();
    var prod=catalog.products.find(function(p){return p.id===target.dataset.id;});
    if(prod && (!prod.variacoes || prod.variacoes.length===0)){ addToCart(prod.id, {}, 1); }
    else { navigate('#/produto/'+target.dataset.id); }
  }
  else if(action==='select-variation'){
    uiState.selectedVariation[target.dataset.tipo]=target.dataset.valor;
    render();
  }
  else if(action==='pd-image'){ uiState.galleryIndex=Number(target.dataset.idx)||0; render(); }
  else if(action==='move-photo'){
    var mvList=uiState.pendingProductPhotos||[];
    var mi=Number(target.dataset.idx), mj=mi+Number(target.dataset.dir);
    if(mj>=0 && mj<mvList.length){ var tmpPh=mvList[mi]; mvList[mi]=mvList[mj]; mvList[mj]=tmpPh; renderPreservingForm(); }
  }
  else if(action==='remove-photo'){
    var rmIdx=Number(target.dataset.idx);
    var rmOwner=(adminEditing.type==='product'&&adminEditing.id) || uiState.newProductId;
    var removed=(uiState.pendingProductPhotos||[]).splice(rmIdx,1)[0];
    renderPreservingForm();
    if(removed) deletePhotoRemote('produto',rmOwner,removed.id);
  }
  else if(action==='remove-single-photo'){
    var tgt=target.dataset.target;
    if(tgt==='category'){
      var oldCat=uiState.pendingCategoryFoto; uiState.pendingCategoryFoto=null; renderPreservingForm();
      if(oldCat) deletePhotoRemote('categoria',(adminEditing.type==='category'&&adminEditing.id)||uiState.newCategoryId,oldCat.id);
    }else if(tgt==='banner'){
      var oldBan=uiState.pendingBannerFoto; uiState.pendingBannerFoto=null; renderPreservingForm();
      if(oldBan) deletePhotoRemote('banner',(adminEditing.type==='banner'&&adminEditing.id)||uiState.newBannerId,oldBan.id);
    }else if(tgt==='logo'){
      var oldLogo=uiState.pendingLogoFoto; uiState.pendingLogoFoto=null; renderPreservingForm();
      if(oldLogo) deletePhotoRemote('loja','logo',oldLogo.id);
    }
  }
  else if(action==='pd-qty'){
    uiState.qty=Math.max(1,(uiState.qty||1)+Number(target.dataset.delta));
    render();
  }
  else if(action==='add-to-cart'){
    var p=catalog.products.find(function(x){return x.id===target.dataset.id;});
    if(!p) return;
    var missing=(p.variacoes||[]).find(function(v){ return !uiState.selectedVariation[v.tipo]; });
    if(p.disponivel===false){ toast('Este produto está esgotado.','error'); return; }
    if(missing){ toast('Escolha uma opção de "'+missing.tipo+'".','error'); return; }
    addToCart(p.id, Object.assign({}, uiState.selectedVariation), uiState.qty||1);
    uiState.qty=1; uiState.selectedVariation={};
  }
  else if(action==='cart-qty'){ updateCartQty(target.dataset.key, Number(target.dataset.delta)); }
  else if(action==='cart-remove'){ removeCartItem(target.dataset.key); }
  else if(action==='clear-filters'){ filters={promo:false,destaque:false,disp:false,preco:''}; render(); }
  else if(action==='clear-cart'){
    openConfirm({title:'Limpar carrinho', message:'Remover todos os itens do carrinho?', onConfirm:function(){ clearCart(); render(); }});
  }
  else if(action==='go-checkout'){ uiState.cartOpen=false; navigate('#/checkout'); }
  else if(action==='sent-order'){ clearCart(); setTimeout(render,0); }
  else if(action==='close-confirm'){ closeConfirm(); }
  else if(action==='confirm-yes'){
    var cb=uiState.confirmModal && uiState.confirmModal.onConfirm;
    uiState.confirmModal=null;
    if(cb) await cb();
  }
  else if(action==='admin-logout'){ e.preventDefault(); session.loggedIn=false; stopOrdersPolling(); navigate('#/admin'); }
  else if(action==='admin-new-product'){ adminEditing={type:'product',id:null}; uiState.pendingProductPhotos=[]; uiState.newProductId=null; render(); }
  else if(action==='admin-edit-product'){
    adminEditing={type:'product',id:target.dataset.id};
    var editingP=catalog.products.find(function(x){return x.id===target.dataset.id;});
    uiState.pendingProductPhotos=(editingP&&editingP.fotos)?editingP.fotos.map(function(f){return {id:f.id};}):[];
    render();
  }
  else if(action==='admin-cancel-edit'){ adminEditing={type:null,id:null}; uiState.pendingProductPhotos=null; uiState.pendingCategoryFoto=undefined; uiState.pendingBannerFoto=undefined; uiState.newProductId=null; uiState.newCategoryId=null; uiState.newBannerId=null; render(); }
  else if(action==='admin-duplicate-product'){
    var orig=catalog.products.find(function(x){return x.id===target.dataset.id;});
    if(orig){
      var copy=JSON.parse(JSON.stringify(orig));
      copy.id=uid('prod'); copy.nome=orig.nome+' (cópia)'; copy.visivel=false;
      catalog.products.push(copy);
      render();
      persistCatalog().then(function(ok){ if(ok) toast('Produto duplicado — fica oculto até você revisar.'); });
    }
  }
  else if(action==='admin-move'){
    if(moveItem(target.dataset.kind, target.dataset.id, Number(target.dataset.dir))){
      render();
      var okMv=await persistCatalog();
      if(okMv) toast('Ordem atualizada.');

  else if(action==='banner-nav'){
    var trk=qs('.banner-track');
    if(trk){
      var reduce=window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      trk.scrollBy({left:Number(target.dataset.dir)*trk.clientWidth,behavior:reduce?'auto':'smooth'});
    }
  }
  else if(action==='admin-toggle-visible'){
    var pr=catalog.products.find(function(x){return x.id===target.dataset.id;});
    if(pr){
      pr.visivel = pr.visivel===false ? true : false;
      var okVis=await persistCatalog();
      render();
      if(okVis) toast('Salvo com sucesso.');
    }
  }
  else if(action==='admin-delete-product'){
    openConfirm({title:'Excluir produto',message:'Tem certeza? Essa ação não pode ser desfeita.',onConfirm:async function(){
      var delP=catalog.products.find(function(x){return x.id===target.dataset.id;});
      catalog.products=catalog.products.filter(function(x){return x.id!==target.dataset.id;});
      var okDel=await persistCatalog();
      render();
      if(okDel) toast('Produto excluído.');
      if(delP && delP.fotos) delP.fotos.forEach(function(f){ deletePhotoRemote('produto',delP.id,f.id); });
    }});
  }
  else if(action==='add-variation-row'){
    var list=qs('#variacoes-list');
    list.appendChild(createVariationRowEl(list.children.length));
    autoLabel();
  }
  else if(action==='remove-variation-row'){ target.closest('.repeater-row').remove(); }
  else if(action==='admin-new-category'){ adminEditing={type:'category',id:null}; uiState.pendingCategoryFoto=null; uiState.newCategoryId=null; render(); }
  else if(action==='admin-edit-category'){
    adminEditing={type:'category',id:target.dataset.id};
    var editingC=catalog.categories.find(function(x){return x.id===target.dataset.id;});
    uiState.pendingCategoryFoto=(editingC&&editingC.foto)?editingC.foto:null;
    render();
  }
  else if(action==='admin-delete-category'){
    openConfirm({title:'Excluir categoria',message:'Tem certeza? Essa ação não pode ser desfeita.',onConfirm:async function(){
      var delC=catalog.categories.find(function(x){return x.id===target.dataset.id;});
      catalog.categories=catalog.categories.filter(function(x){return x.id!==target.dataset.id;});
      var okDel=await persistCatalog();
      render();
      if(okDel) toast('Categoria excluída.');
      if(delC && delC.foto) deletePhotoRemote('categoria',delC.id,delC.foto.id);
    }});
  }
  else if(action==='admin-new-banner'){ adminEditing={type:'banner',id:null}; uiState.pendingBannerFoto=null; uiState.newBannerId=null; render(); }
  else if(action==='admin-edit-banner'){
    adminEditing={type:'banner',id:target.dataset.id};
    var editingB=catalog.banners.find(function(x){return x.id===target.dataset.id;});
    uiState.pendingBannerFoto=(editingB&&editingB.foto)?editingB.foto:null;
    render();
  }
  else if(action==='admin-delete-banner'){
    openConfirm({title:'Excluir banner',message:'Tem certeza? Essa ação não pode ser desfeita.',onConfirm:async function(){
      var delB=catalog.banners.find(function(x){return x.id===target.dataset.id;});
      catalog.banners=catalog.banners.filter(function(x){return x.id!==target.dataset.id;});
      var okDel=await persistCatalog();
      render();
      if(okDel) toast('Banner excluído.');
      if(delB && delB.foto) deletePhotoRemote('banner',delB.id,delB.foto.id);
    }});
  }
  else if(action==='admin-view-order'){ adminEditing={type:'order',id:target.dataset.id}; render(); }
  else if(action==='admin-advance-status' || action==='admin-set-status'){
    await setOrderStatus(target.dataset.id, target.dataset.status);
  }
  else if(action==='admin-refresh-orders'){

    render();

  }
  else if(action==='admin-export-backup'){

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){
    if(uiState.confirmModal){ closeConfirm(); }
    else if(uiState.cartOpen){ uiState.cartOpen=false; render(); var cb2=qs('.cart-btn'); if(cb2) cb2.focus(); }
    return;
  }
  if(e.key==='Tab' && (uiState.cartOpen || uiState.confirmModal)){
    var box = uiState.confirmModal ? qs('.modal-box') : qs('.drawer');
    if(box){
      var foc = qsa('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])', box);
      if(foc.length){
        var first=foc[0], last=foc[foc.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
        else if(!box.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
      }
    }
    return;
  }
  if(e.key==='Enter' || e.key===' '){
    var el=document.activeElement;
    if(el && el.matches && el.matches('[role="button"][data-action]')){
      e.preventDefault();
      el.click();
    }
  }
});

        await refreshServerOrders(false);
        startOrdersPolling();
        navigate('#/admin/dashboard');
      }else{
        uiState.loginError='Usuário ou senha inválidos.';
        render();
      }
    });
  }

  var checkoutForm=qs('#checkout-form');
  if(checkoutForm){
    qsa('[data-field]',checkoutForm).forEach(function(inp){
      inp.addEventListener('input', function(){ checkoutData[inp.dataset.field]=inp.value; });
    });
    checkoutForm.addEventListener('submit', async function(e){
      e.preventDefault();
      if(uiState.submittingOrder) return;
      checkoutErrors=validateCheckout(checkoutData);
      if(Object.keys(checkoutErrors).length){ render(); toast('Confira os campos destacados.','error'); return; }
      uiState.submittingOrder=true;
      var submitBtn=qs('#checkout-form button[type=submit]');
      if(submitBtn){ submitBtn.disabled=true; submitBtn.textContent='Enviando pedido...'; }
      var payload={
        cliente:{nome:checkoutData.nome, whatsapp:checkoutData.whatsapp},
        entrega:{cep:checkoutData.cep,estado:checkoutData.estado,cidade:checkoutData.cidade,bairro:checkoutData.bairro,rua:checkoutData.rua,numero:checkoutData.numero,complemento:checkoutData.complemento},
        itens: cart.map(function(i){ return {productId:i.productId,nome:i.nome,preco:i.preco,qty:i.qty,variacao:i.variacao}; })
      };
      var result=await createOrderOnServer(payload);
      uiState.submittingOrder=false;
      if(result.error){
        toast(result.error,'error');
        if(submitBtn){ submitBtn.disabled=false; submitBtn.textContent='Confirmar pedido'; }
        return;
      }
      var order;
      if(result.order){
        order=result.order; order.synced=true;          // registrado no servidor (id e preços conferidos lá)
      }else{
        order={                                          // servidor inacessível: o pedido segue pelo WhatsApp e fica salvo neste aparelho
          id: nextOrderId(),
          criadoEm: Date.now(),
          cliente:payload.cliente, entrega:payload.entrega,
          itens: cart.map(function(i){ return {nome:i.nome,preco:i.preco,qty:i.qty,variacao:i.variacao}; }),
          total: cartTotal(),
          status:'novo',
          synced:false
        };
      }
      orders.push(order); persistOrders();
      checkoutData={nome:'',whatsapp:'',cep:'',estado:'',cidade:'',bairro:'',rua:'',numero:'',complemento:''};
      checkoutErrors={};
      navigate('#/pedido/'+order.id);
    });
  }

  var productForm_=qs('#product-form');
  if(productForm_){
    productForm_.addEventListener('submit', function(e){
      e.preventDefault();
      var id=productForm_.dataset.id;
      var existing=catalog.products.find(function(x){return x.id===id;});
      var variacoes=qsa('.repeater-row',productForm_).map(function(row){
        var tipo=qs('[data-var-tipo]',row).value.trim();
        var opcoes=qs('[data-var-opcoes]',row).value.split(',').map(function(s){return s.trim();}).filter(Boolean);
        return tipo && opcoes.length ? {tipo:tipo,opcoes:opcoes} : null;
      }).filter(Boolean);
      var data={
        id:id,
        nome:qs('[data-field=p_nome]',productForm_).value.trim(),
        descricaoCurta:qs('[data-field=p_descricaoCurta]',productForm_).value,
        descricaoCompleta:qs('[data-field=p_descricaoCompleta]',productForm_).value,
        categoriaId:qs('[data-field=p_categoriaId]',productForm_).value,
        preco:Number(qs('[data-field=p_preco]',productForm_).value)||0,
        precoPromocional:Number(qs('[data-field=p_precoPromocional]',productForm_).value)||0,
        sku:qs('[data-field=p_sku]',productForm_).value,
        fotos:(uiState.pendingProductPhotos||[]).slice(),
        tags:qs('[data-field=p_tags]',productForm_).value.split(',').map(function(t){return t.trim();}).filter(Boolean).slice(0,20),
        variacoes:variacoes,
        destaque:qs('[data-field=p_destaque]',productForm_).checked,
        lancamento:qs('[data-field=p_lancamento]',productForm_).checked,
        disponivel:qs('[data-field=p_disponivel]',productForm_).checked,
        visivel:qs('[data-field=p_visivel]',productForm_).checked
      };
      if(!data.nome){ toast('Preencha o nome do produto.','error'); return; }
      if(existing){ Object.assign(existing,data); }
      else{ catalog.products.push(data); }
      adminEditing={type:null,id:null}; uiState.pendingProductPhotos=null; uiState.newProductId=null;
      render();
      persistCatalog().then(function(ok){ if(ok) toast('Salvo com sucesso.'); });
    });
  }

  var categoryForm_=qs('#category-form');
  if(categoryForm_){
    categoryForm_.addEventListener('submit', async function(e){
      e.preventDefault();
      var id=categoryForm_.dataset.id;
      var existing=catalog.categories.find(function(x){return x.id===id;});
      var data={
        id:id,
        nome:qs('[data-field=c_nome]',categoryForm_).value.trim(),
        descricao:qs('[data-field=c_descricao]',categoryForm_).value,
        foto:uiState.pendingCategoryFoto||null,
        status:qs('[data-field=c_ativo]',categoryForm_).checked?'ativo':'inativo'
      };
      if(!data.nome){ toast('Preencha o nome da categoria.','error'); return; }
      if(existing){ Object.assign(existing,data); }
      else{ data.ordem=catalog.categories.length; catalog.categories.push(data); }
      adminEditing={type:null,id:null}; uiState.pendingCategoryFoto=undefined; uiState.newCategoryId=null;
      render();
      persistCatalog().then(function(ok){ if(ok) toast('Salvo com sucesso.'); });
    });
  }

  var bannerForm_=qs('#banner-form');
  if(bannerForm_){
    bannerForm_.addEventListener('submit', async function(e){
      e.preventDefault();
      var id=bannerForm_.dataset.id;
      var existing=catalog.banners.find(function(x){return x.id===id;});
      var data={
        id:id,
        titulo:qs('[data-field=b_titulo]',bannerForm_).value,
        foto:uiState.pendingBannerFoto||null,
        subtitulo:qs('[data-field=b_subtitulo]',bannerForm_).value,
        textoBotao:qs('[data-field=b_textoBotao]',bannerForm_).value,
        destino:qs('[data-field=b_destino]',bannerForm_).value,
        ativo:qs('[data-field=b_ativo]',bannerForm_).checked
      };
      if(existing){ Object.assign(existing,data); }
      else{ data.ordem=catalog.banners.length; catalog.banners.push(data); }
      adminEditing={type:null,id:null}; uiState.pendingBannerFoto=undefined; uiState.newBannerId=null;
      render();
      persistCatalog().then(function(ok){ if(ok) toast('Salvo com sucesso.'); });
    });
  }

  var configForm=qs('#config-form');
  if(configForm){
    configForm.addEventListener('submit', async function(e){
      e.preventDefault();
      catalog.store.nome=qs('[data-field=s_nome]',configForm).value.trim()||'Minha Loja';
      catalog.store.favicon=qs('[data-field=s_favicon]',configForm).value||'🛍️';
      catalog.store.descricao=qs('[data-field=s_descricao]',configForm).value;
      catalog.store.whatsapp=qs('[data-field=s_whatsapp]',configForm).value.replace(/\D/g,'');
      catalog.store.instagram=qs('[data-field=s_instagram]',configForm).value;
      catalog.store.logoFoto=uiState.pendingLogoFoto||null;
      catalog.store.email=qs('[data-field=s_email]',configForm).value.trim();
      catalog.store.cores={
        primary:qs('[data-field=s_primary]',configForm).value,
        secondary:qs('[data-field=s_secondary]',configForm).value,
        accent:qs('[data-field=s_accent]',configForm).value,
        bg:qs('[data-field=s_bg]',configForm).value
      };
      var tokenField=qs('[data-field=s_token]',configForm);
      if(tokenField) setAdminToken(tokenField.value.trim());
      render();
      var okCfg=await persistCatalog();
      if(okCfg) toast('Salvo com sucesso.');
    });
  }

  var adminAccountForm=qs('#admin-account-form');
  if(adminAccountForm){
    adminAccountForm.addEventListener('submit', function(e){
      e.preventDefault();
      admin.usuario=qs('[data-field=a_usuario]',adminAccountForm).value.trim()||admin.usuario;
      admin.senha=qs('[data-field=a_senha]',adminAccountForm).value||admin.senha;
      persistAdmin();
      toast('Salvo com sucesso.');
    });
  }

  var importInput=qs('#import-backup-input');
  // change listener already bound globally above (delegation on document 'change')
  void importInput;
}

/* ================= INIT ================= */
function renderLoadingScreen(){
  var el=document.getElementById('app');
  if(el) el.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);font-family:var(--font-body)">Carregando loja...</div>';
}

async function bootstrap(){
  renderLoadingScreen();
  try{
    var doc=await fetchCatalogFromServer();
    serverVersion=doc.version||0;
    localStorage.setItem(VERSION_KEY,String(serverVersion));
    if(doc.data){
      catalog=doc.data;
      saveJSON(DB_KEY,catalog);
    }
    syncStatus.online=true; syncStatus.lastError=null;
  }catch(err){
    // sem conexão com a função/servidor: segue com o cache local (já carregado no topo do script)
    syncStatus.online=false; syncStatus.lastError=err.message;
  }
  applyTheme();
  render();
}
bootstrap();

})();
</script>
</body>
</html>
